services:
  agent-chat-lab:
    image: ghcr.io/abowloflrf/agent-chat-lab:main
    container_name: agent-chat-lab
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
    user: "1000:1000"
    working_dir: /app
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - BASH_TOOL_WORKDIR=/app/workspace
      - TZ=Asia/Shanghai
      # Set to your external https origin so the MCP OAuth redirect_uri stays
      # stable; if unset it is derived from x-forwarded-* / Host headers.
      # - APP_BASE_URL=https://your-host
    restart: unless-stopped
