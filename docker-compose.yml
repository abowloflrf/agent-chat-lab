services:
  agent-chat-lab:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: agent-chat-lab
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
    user: "1000:1000"
    working_dir: /app
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - BASH_TOOL_WORKDIR=/app/workspace
    restart: unless-stopped
